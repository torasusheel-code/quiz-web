<!DOCTYPE html>
<html>
<head>

    <title>Quiz Login</title>

    <style>
       body{
    margin:0;
    padding:0;
    font-family:Arial;

    background-image:url("/static/bg.jpg.jpg");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}
        .main-box{
            display:flex;
            flex-direction:column;
            align-items:center;
        }
.login-box{
    width:350px;
    padding:35px;

    background:rgba(255,255,255,0.2);

    backdrop-filter:blur(10px);

    border-radius:20px;

    box-shadow:0 0 25px rgba(0,0,0,0.3);

    text-align:center;
}
        

        h2{
            margin-bottom:25px;
            font-size:34px;
            color:#222;
        }

        input{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
            box-sizing:border-box;
        }

        input:focus{
            outline:none;
            border-color:#007bff;
            box-shadow:0 0 5px #007bff;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:20px;
            background:linear-gradient(45deg,#007bff,#00c6ff);
            color:white;
            border:none;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.03);
        }

        .record-btn{
            display:block;
            margin-top:15px;
            padding:14px;
            background:linear-gradient(45deg,#28a745,#5ad66f);
            color:white;
            text-decoration:none;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
            transition:0.3s;
        }

        .record-btn:hover{
            transform:scale(1.03);
        }

        .note{
            margin-top:20px;
            font-size:17px;
            font-weight:bold;
            color:#222;
            background:white;
            padding:12px 20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .admin-link{
            position:fixed;
            bottom:10px;
            right:15px;
            color:#333;
            text-decoration:none;
            font-size:12px;
        }

    </style>

</head>

<body>

<div class="main-box">

    <div class="login-box">

        <h2>🧠 Quiz Login</h2>

        <form method="POST">

            <input type="text"
                   name="name"
                   placeholder="Enter Your Name"
                   required>

            <input type="text"
                   name="phone"
                   placeholder="Enter Phone Number"
                   required>

            <button type="submit">
                🚀 Start Quiz
            </button>

        </form>

        <a href="/myresult" class="record-btn">
            🏆 My Result
        </a>

    </div>

    <div class="note">
        📢 Please enter correct details before starting the quiz.
    </div>
    <div class="note">
        “The purpose of this quiz is to evaluate the student's basic knowledge and understanding.”
    </div>

</div>

<a href="/tora-admin-2026-secret"
   class="admin-link">
   admin
</a>

</body>
</html>
