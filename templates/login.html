<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body{
            font-family:Arial;
            background:#f2f2f2;
            text-align:center;
            padding-top:100px;
        }

        .box{
            background:white;
            width:300px;
            margin:auto;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px;
        }

        button{
            padding:10px 20px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
        }
    </style>
</head>

<body>

<div class="box">

<h2>🔐 Quiz Login</h2>

<form method="POST">

<input type="text" name="username" placeholder="Enter Username" required>

<br>

<button type="submit">Start Quiz</button>

</form>

</div>

</body>
</html>
