<!DOCTYPE html>
<html>
<head>

    <title>Quiz Login</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:white;
            padding:30px;
            width:320px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        .record-btn{
            display:block;
            text-align:center;
            margin-top:15px;
            text-decoration:none;
            background:#28a745;
            color:white;
            padding:10px;
            border-radius:5px;
        }

        .record-btn:hover{
            background:#1e7e34;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h2>🧠 Quiz Login</h2>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Enter Your Name"
               required>

        <input type="text"
               name="phone"
               placeholder="Enter Phone Number"
               required>

        <button type="submit">
            Start Quiz
        </button>

    </form>

    <a href="/myresult" class="record-btn">
        🏆 My Result
    </a>

</div>

</body>
</html>
