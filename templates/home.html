<!DOCTYPE html>
<html>
<head>

    <title>Quiz App</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
            padding:20px;
        }

        h1{
            text-align:center;
            color:#333;
        }

        #timer-box{
            position:fixed;
            top:20px;
            right:20px;
            background:red;
            color:white;
            padding:12px 20px;
            border-radius:10px;
            font-size:20px;
            font-weight:bold;
            z-index:1000;
            box-shadow:0 0 10px gray;
        }

        .question-box{
            background:white;
            padding:20px;
            margin-bottom:20px;
            border-radius:10px;
            box-shadow:0 0 10px #ccc;
        }

        .question-box h3{
            color:#222;
        }

        label{
            font-size:18px;
        }

        .submit-btn{
            width:100%;
            padding:14px;
            background:linear-gradient(45deg,#007bff,#00c6ff);
            color:white;
            border:none;
            border-radius:10px;
            font-size:20px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .submit-btn:hover{
            transform:scale(1.02);
        }

    </style>

</head>

<body>

<h1>🧠 Online Quiz</h1>

<form method="POST" id="quizForm">

    <div id="timer-box">

        ⏰ Time Left:
        <span id="timer">500</span>s

    </div>

    {% for q in questions %}

        <div class="question-box">

            <h3>{{ q.question }}</h3>

            {% set outer_loop = loop.index0 %}

            {% for option in q.options %}

                <label>

                    <input type="radio"
                           name="{{ outer_loop }}"
                           value="{{ option }}">

                    {{ option }}

                </label>

                <br><br>

            {% endfor %}

        </div>

    {% endfor %}

    <button type="submit" class="submit-btn">
        🚀 Submit Quiz
    </button>

</form>

<script>

let timeLeft = 500;

let timer = document.getElementById("timer");

let quizForm = document.getElementById("quizForm");

let countdown = setInterval(function(){

    timeLeft--;

    timer.innerHTML = timeLeft;

    if(timeLeft <= 10){

        document.getElementById("timer-box").style.background = "darkred";

    }

    if(timeLeft <= 0){

        clearInterval(countdown);

        alert("⏰ Time Over! Quiz Submitted");

        quizForm.submit();
    }

}, 1000);

</script>

</body>
</html>
