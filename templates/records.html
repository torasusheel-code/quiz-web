<!DOCTYPE html>
<html>
<head>

    <title>All Records</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
            padding:30px;
        }

        h2{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 10px gray;
        }

        th, td{
            border:1px solid gray;
            padding:12px;
            text-align:center;
        }

        th{
            background:#007bff;
            color:white;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }

    </style>

</head>

<body>

<h2>📊 All Quiz Records</h2>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Phone</th>
    <th>Score</th>
</tr>

{% for r in records %}

<tr>
    <td>{{ r[0] }}</td>
    <td>{{ r[1] }}</td>
    <td>{{ r[2] }}</td>
    <td>{{ r[3] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
