<!DOCTYPE html>
<html>
<head>
    <title>Quiz Records</title>

    <style>
        body{
            font-family:Arial;
            background:#f2f2f2;
            padding:40px;
        }

        h1{
            text-align:center;
        }

        table{
            width:70%;
            margin:auto;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 10px gray;
        }

        th{
            background:#007bff;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            text-align:center;
            border:1px solid #ccc;
        }

        tr:nth-child(even){
            background:#f9f9f9;
        }
    </style>
</head>

<body>

<h1>📊 Students Quiz Records</h1>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Marks</th>
</tr>

{% for row in records %}

<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
